[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomass-heat-plant-model"
version = "0.1.0"
description = "Modular agent-based plant model for biomass gasification process chains supplying industrial high-temperature process heat (air / oxyfuel / steam gasification, methanation, electrolysis, H2/O2 storage)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DataWithSyed" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]
keywords = ["biomass", "gasification", "process heat", "methanation", "electrolysis", "agent-based", "energy systems"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["matplotlib>=3.7", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/DataWithSyed/biomass-heat-plant-model"
Project = "https://github.com/DataWithSyed/biomass-process-heat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
